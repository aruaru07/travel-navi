<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Navi - 旅のナビゲーター</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif JP"', 'serif'],
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        wamodan: {
                            bg: '#121619',        
                            card: '#1c2226',        
                            cardLight: '#242b30',
                            text: '#f2f0eb',        
                            muted: '#9ba2a6', 
                            gold: '#cda863',        
                            goldHover: '#dfbd78',
                            border: '#2e373e'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-wamodan-bg text-wamodan-text font-sans min-h-screen flex flex-col justify-between selection:bg-wamodan-gold selection:text-wamodan-bg">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-50 bg-wamodan-bg/90 backdrop-blur-md border-b border-wamodan-border transition-all">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <!-- ロゴ -->
            <div class="flex items-center space-x-3 cursor-pointer group" id="logo-btn">
                <div class="w-9 h-9 border border-wamodan-gold text-wamodan-gold font-serif font-semibold flex items-center justify-center text-sm tracking-widest group-hover:bg-wamodan-gold group-hover:text-wamodan-bg transition duration-300">
                    旅
                </div>
                <span class="font-serif tracking-widest text-lg font-light text-wamodan-text">Travel Navi</span>
            </div>

            <!-- ナビゲーションメニュー -->
            <nav class="hidden md:flex space-x-1 lg:space-x-2">
                <button id="nav-gacha-btn" class="nav-link px-4 py-2 rounded-none text-xs tracking-widest font-serif transition text-wamodan-muted hover:text-wamodan-gold">
                    旅みくじ
                </button>
                <button id="nav-budget-btn" class="nav-link px-4 py-2 rounded-none text-xs tracking-widest font-serif transition text-wamodan-muted hover:text-wamodan-gold">
                    ご予算別
                </button>
                <button id="nav-places-btn" class="nav-link px-4 py-2 rounded-none text-xs tracking-widest font-serif transition text-wamodan-muted hover:text-wamodan-gold">
                    名所一覧
                </button>
                <button id="nav-secret-btn" class="nav-link px-4 py-2 rounded-none text-xs tracking-widest font-serif transition text-wamodan-muted hover:text-wamodan-gold">
                    隠れ里・秘境
                </button>
                <button id="nav-memories-btn" class="nav-link px-4 py-2 rounded-none text-xs tracking-widest font-serif transition text-wamodan-muted hover:text-wamodan-gold">
                    個人日記
                </button>
            </nav>

            <!-- モバイルメニューボタン -->
            <div class="md:hidden flex items-center">
                <button id="mobile-menu-toggle" class="text-wamodan-text p-2 focus:outline-none">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- モバイルメニュー -->
        <div id="mobile-menu" class="hidden md:hidden bg-wamodan-card border-b border-wamodan-border px-6 py-4 space-y-2 font-serif text-sm">
            <button id="mob-gacha-btn" class="w-full text-left px-4 py-2.5 text-wamodan-muted hover:text-wamodan-gold">旅みくじ</button>
            <button id="mob-budget-btn" class="w-full text-left px-4 py-2.5 text-wamodan-muted hover:text-wamodan-gold">ご予算別</button>
            <button id="mob-places-btn" class="w-full text-left px-4 py-2.5 text-wamodan-muted hover:text-wamodan-gold">名所一覧</button>
            <button id="mob-secret-btn" class="w-full text-left px-4 py-2.5 text-wamodan-muted hover:text-wamodan-gold">隠れ里・秘境</button>
            <button id="mob-memories-btn" class="w-full text-left px-4 py-2.5 text-wamodan-muted hover:text-wamodan-gold">旅帖</button>
        </div>
    </header>

    <!-- ヒーローセクション -->
    <section class="hero-bg relative pt-20 pb-28 px-6 text-center text-wamodan-text">
        <div class="max-w-3xl mx-auto">
            <span class="inline-block px-5 py-1 border border-wamodan-gold/60 text-wamodan-gold text-xs tracking-widest uppercase font-serif mb-8">
                JAPANESE ELEGANCE
            </span>
            <h1 class="text-3xl sm:text-5xl font-serif font-normal tracking-widest leading-relaxed mb-6">
                心澄みわたる、日本の旅へ。
            </h1>
            <p class="text-wamodan-muted text-sm sm:text-base max-w-lg mx-auto mb-12 font-light leading-relaxed tracking-wider">
                四季折々の美しい風光と、静寂に包まれた極上の旅路をご案内いたします。
            </p>

            <!-- メインカード -->
            <div id="main-content-card" class="bg-wamodan-card text-wamodan-text rounded-none p-8 sm:p-12 wamodan-shadow transition-all duration-300 text-left border border-wamodan-border relative">
                <!-- 動的コンテンツ -->
            </div>
        </div>
    </section>

    <!-- フッター -->
    <footer class="bg-wamodan-bg text-wamodan-muted py-12 border-t border-wamodan-border text-center text-xs font-serif tracking-widest">
        <div class="max-w-6xl mx-auto px-6">
            <p class="text-wamodan-text mb-2">Travel Navi — 美しき日本の情景を巡る</p>
            <p class="font-light text-wamodan-muted/70">&copy; 2026 Travel Navi All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
